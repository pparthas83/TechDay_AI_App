<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Avatar Preview - Con Ed Tech Day</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #070d19; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #renderCanvas { width: 100%; height: 100%; display: block; }
    #info { position: absolute; top: 16px; left: 16px; color: #00d2ff; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; background: rgba(7,13,25,0.85); padding: 10px 18px; border-radius: 8px; border: 1px solid rgba(0,210,255,0.3); backdrop-filter: blur(8px); z-index: 10; }
    #badge { color: #2ecc71; margin-left: 8px; }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
  <div id="info">CON EDISON TECH DAY // 3D MODERATOR PREVIEW <span id="badge">● 60 FPS</span></div>
  <canvas id="renderCanvas"></canvas>
  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);
    
    const params = new URLSearchParams(window.location.search);
    const modelName = params.get('model') || 'brunette';

    const createScene = function () {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.04, 0.08, 0.16, 1.0);

      // ArcRotate camera looking at upper body/face
      const camera = new BABYLON.ArcRotateCamera("Camera", -Math.PI / 2, Math.PI / 2.3, 1.1, new BABYLON.Vector3(0, 1.45, 0), scene);
      camera.attachControl(canvas, true);
      camera.lowerRadiusLimit = 0.4;
      camera.upperRadiusLimit = 3.0;

      // Studio 3-point lighting setup
      const keyLight = new BABYLON.DirectionalLight("keyLight", new BABYLON.Vector3(-0.5, -0.8, 1.0), scene);
      keyLight.intensity = 2.2;
      keyLight.diffuse = new BABYLON.Color3(1.0, 0.98, 0.95);

      const fillLight = new BABYLON.HemisphericLight("fillLight", new BABYLON.Vector3(0, 1, 0), scene);
      fillLight.intensity = 1.1;
      fillLight.diffuse = new BABYLON.Color3(0.8, 0.9, 1.0);

      const rimLight = new BABYLON.DirectionalLight("rimLight", new BABYLON.Vector3(1.0, 0.5, -1.0), scene);
      rimLight.intensity = 1.6;
      rimLight.diffuse = new BABYLON.Color3(0.0, 0.8, 1.0); // Con Ed electric cyan rim

      // Load avatar with correct directory and filename
      BABYLON.SceneLoader.ImportMeshAsync("", "/public/assets/avatars/", `${modelName}.glb`, scene).then(function (result) {
        console.log("Avatar loaded successfully! Mesh count:", result.meshes.length);
        const root = result.meshes[0];
        
        // Correct 180 rotation for glTF root with rotationQuaternion
        if (root.rotationQuaternion) {
          const rotY = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.Y, Math.PI);
          root.rotationQuaternion = rotY.multiply(root.rotationQuaternion);
        } else {
          root.rotation.y += Math.PI;
        }

        // Fix glTF transparency sorting on hair & clothes
        scene.materials.forEach(mat => {
          mat.needDepthPrePass = true;
          mat.backFaceCulling = true;
        });

        // Frame clean portrait on face and upper blazer
        camera.setTarget(new BABYLON.Vector3(0, 1.58, 0));
        camera.radius = 0.65;

        // Apply pleasant, cheerful expression on blendshapes
        result.meshes.forEach(m => {
          if (m.morphTargetManager) {
            const mtm = m.morphTargetManager;
            for (let i = 0; i < mtm.numTargets; i++) {
              const target = mtm.getTarget(i);
              // Slight pleasant smile
              if (target.name.toLowerCase().includes('smile') || target.name === 'mouthSmile') {
                target.influence = 0.35;
              }
            }
          }
        });
      }).catch(function (error) {
        console.error("Error loading avatar:", error);
      });

      return scene;
    };

    const scene = createScene();
    engine.runRenderLoop(function () {
      scene.render();
    });

    window.addEventListener("resize", function () {
      engine.resize();
    });
  </script>
</body>
</html>
